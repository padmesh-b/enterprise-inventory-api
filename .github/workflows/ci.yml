name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: enterprise_inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Prisma Generate
      run: npx prisma generate

    - name: Prisma Migrate (Test DB)
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/enterprise_inventory_test?schema=public"

    - name: Unit and Integration Tests (Coverage)
      run: npm run test:cov
      env:
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/enterprise_inventory_test?schema=public"
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: E2E Tests
      run: npm run test:e2e
      env:
        DATABASE_URL: "postgresql://postgres:password@localhost:5432/enterprise_inventory_test?schema=public"
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        REDIS_HOST: localhost
        REDIS_PORT: 6379

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
    - uses: actions/checkout@v3
    - name: Build Docker Image
      run: docker build -t enterprise-inventory-api:latest .
